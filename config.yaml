# =========================================================
# KONFIGURACJA - edytuj ten plik żeby dostosować apkę
# =========================================================

# Minimalny zysk (w zł), przy którym apka wyśle powiadomienie
min_profit_pln: 200

# Margines bezpieczeństwa - dodatkowo odejmowany od szacowanego zysku
# (na nieprzewidziane koszty, transport, opakowanie, czas)
safety_margin_pln: 30

# Ile aktywnych/podobnych ofert brać pod uwagę przy szacowaniu wartości rynkowej
comparables_min_count: 5

# Co ile minut apka ma sprawdzać ogłoszenia (używane w harmonogramie GitHub Actions).
# Przy dużej liczbie modeli (jak w tej konfiguracji: ~40) każdy przebieg to bardzo
# dużo zapytań do 4 serwisów (40 modeli x 4 źródła = 160+ zapytań) - 45 minut jest
# bezpieczniejsze niż 15-30 (mniejsze ryzyko zablokowania przez OLX/Vinted).
# Jeśli zawęzisz listę modeli, możesz skrócić ten czas.
scan_interval_minutes: 45

# Lista modeli telefonów do monitorowania.
# "query" - fraza wyszukiwania używana na wszystkich portalach
# "search_variants" - dodatkowe warianty zapytań (opcjonalne, np. inny zapis nazwy)
