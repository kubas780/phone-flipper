# Słowa wskazujące, że to NIE jest prawdziwy telefon, tylko akcesorium/atrapa/część -
# takie ogłoszenia są całkowicie pomijane (nie wchodzą ani do wyceny rynkowej,
# ani do wykrywania okazji). To najczęstsza przyczyna "fałszywych" okazji i
# zaniżonej wyceny rynkowej (np. etui za 20 zł myli medianę cen).
exclude_keywords:
  - "etui"
  - "case"
  - "obudowa"
  - "szkło hartowane"
  - "szko hartowane"
  - "szybka ochronna"
  - "folia ochronna"
  - "folia na ekran"
  - "atrapa"
  - "gablota"
  - "makieta"
  - "zaślepka"
  - "zaslepka"
  - "podstawka"
  - "uchwyt"
  - "stojak"
  - "ładowarka"
  - "ladowarka"
  - "kabel usb"
  - "powerbank"
  - "słuchawki"
  - "sluchawki"
  - "opakowanie"
  - "pudełko po"
  - "pudelko po"
  - "karton po"
  - "naklejka"
  - "skin na telefon"
  - "torba na telefon"
  - "plecak"
  - "smycz"
  - "pasek do telefonu"
  - "rysunek"
  - "zdjęcie telefonu"
  - "zdjecie telefonu"
  - "instrukcja obsługi"
  - "instrukcja obslugi"
  - "kopia"
  - "replika"
  - "podróbka"
  - "podrobka"
  - "klon"
  - "super kopia"
  - "chińska podróbka"
  - "chinska podrobka"
  - "zamiennik chiński"
  - "zamiennik chinski"

# Domyślna minimalna cena (w zł) - używana TYLKO jeśli dany model w liście `phones`
# nie ma własnego pola `min_price_pln`. Każdy model w liście `phones` ma teraz
# swój indywidualny, realny próg (patrz pole `min_price_pln` przy każdym modelu) -
# to znacznie lepsze zabezpieczenie niż jeden próg dla wszystkich, bo np. Z Fold8
# Ultra nie powinien nigdy pojawić się jako "okazja" za 250 zł (to na pewno pomyłka
# kategorii/literówka w cenie/oszustwo), a dla iPhone'a 14 250 zł to sensowny dolny próg.
# UWAGA: wartości min_price_pln przy modelach to moje przybliżone szacunki - jeśli po
# obserwacji realnych ogłoszeń uznasz, że dla któregoś modelu próg powinien być inny,
# po prostu zmień liczbę przy tym modelu w sekcji `phones` powyżej.
min_listing_price_pln: 250

# Słowa kluczowe wskazujące, że telefon jest uszkodzony (do wykrywania w opisie/tytule)
damage_keywords:
  - "uszkodzon"
  - "pęknię"
  - "peknie"
  - "rysa"
  - "nie działa"
  - "nie dziala"
  - "zbita"
  - "spalon"
  - "na części"
  - "na czesci"
  - "do naprawy"
  - "bateria słaba"
  - "bateria slaba"
  - "wyświetlacz"
  - "matryca"

# Typowe usterki -> czego szukać jako część zamienna na Allegro
# (klucz: fragment tekstu z ogłoszenia, wartość: fraza do wyszukania części)
damage_to_part_query:
  "wyświetlacz": "wyświetlacz oryginalny {model}"
  "matryca": "wyświetlacz oryginalny {model}"
  "bateria": "bateria oryginalna {model}"
  "szyb": "szybka oryginalna {model}"
  "aparat": "aparat oryginalny {model}"
  "gniazdo ładowania": "gniazdo ładowania {model}"

# Źródła do przeszukania - można wyłączyć dowolne ustawiając false
sources:
  # Tymczasowo wyłączone (2026): Allegro API blokuje /offers/listing dla
  # niezweryfikowanych aplikacji (błąd 403 "VerificationRequired" - wysłano wniosek
  # o weryfikację, czekamy na odpowiedź). OLX i Allegro Lokalnie prawdopodobnie
  # blokują adresy IP GitHub Actions (403/429). Włącz je z powrotem (true), jeśli
  # sytuacja się zmieni - np. po weryfikacji Allegro albo przeniesieniu apki na
  # własny komputer (adresy domowe rzadziej są blokowane).
  allegro: false
  allegro_lokalnie: false
  olx: false
  vinted: true
